name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mamba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mamba"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PORT: "3000"
      HOST: "0.0.0.0"
      NODE_ENV: test
      FRONTEND_URL: http://localhost:3000
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: mamba
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mamba?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Unit tests
        run: pnpm test --ci
      - name: End-to-end tests
        run: pnpm test:e2e --ci
